<!-- 聯絡頁主要內容 -->
<main class="contact-page">

    <!-- 左邊：地圖 -->
    <section class="map-wrap">
        <iframe class="map"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3641.177433218791!2d120.67325707593588!3d24.13040617408055!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x34693d0516e3cb9b%3A0x9539cc10cdde7db4!2zNDAy6Ie65Lit5biC5Y2X5Y2A5pyJ5oGG6KGXNTLomZ8!5e0!3m2!1szh-TW!2stw!4v1766041705416!5m2!1szh-TW!2stw" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </section>

    <!-- 右邊：表單 -->
    <section class="form-wrap">
        <form id="contactForm" novalidate>

            <!-- 成功提示 -->
            <div id="formSuccess" class="form-success">
                <span class="success-text">
                    <i class="fas fa-check-circle"></i>
                    已成功送出，我們會盡快與您聯絡！
                </span>
                <button type="button" class="close-btn">×</button>
            </div>

            <!-- 以下表單內容「完全保留你原本的」 -->
            <!-- 公司名稱 -->
            <div class="field">
                <label for="company">公司名稱</label>
                <input id="company" name="company" type="text">
            </div>

            <!-- 聯絡人 -->
            <div class="field">
                <label>聯絡人</label>
                <div class="grid-2">
                    <input type="text" placeholder="姓氏">
                    <input type="text" placeholder="名字">
                </div>
            </div>

            <!-- Email -->
            <div class="field">
                <label for="email">E-mail <span class="req">*</span></label>
                <input id="email" name="email" type="email" placeholder="ex: myname@example.com">
            </div>

            <!-- 電話 -->
            <div class="field">
                <label>聯絡電話</label>
                <div class="grid-2">
                    <input type="tel" placeholder="電話含區碼">
                    <input type="text" placeholder="分機">
                </div>
            </div>

            <!-- 需求項目 -->
            <div class="field">
                <label>主要需求項目</label>
                <div class="checks">
                    <label><input type="checkbox"> 論文精裝</label>
                    <label><input type="checkbox"> 彩色精裝</label>
                    <label><input type="checkbox"> 平裝</label>
                    <label><input type="checkbox"> 縫線裝</label>
                    <label><input type="checkbox"> 施工圖裱冊</label>
                    <label><input type="checkbox"> 蝶冊</label>
                    <label><input type="checkbox"> 證書夾</label>
                    <label><input type="checkbox"> 螺絲裝菜單</label>
                    <label><input type="checkbox"> 檔案夾</label>
                </div>
            </div>

            <!-- 檔案 -->
            <div class="field">
                <label for="myFile">附加檔案</label>
                <input type="file" id="myFile" name="filename">
            </div>

            <!-- 說明 -->
            <div class="field">
                <label>需求說明</label>
                <textarea rows="6"></textarea>
            </div>

            <div class="actions">
                <button class="btn primary" type="submit">送出</button>
                <button class="btn dark" type="reset">清除重填</button>
            </div>

        </form>
    </section>

</main>
